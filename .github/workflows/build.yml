# Tests every change and builds a NON-CUSTOMER Windows installer with throwaway verification keys.
# Automated publication is disabled: a commercial release requires the owner's real
# PUBLIC verification key, owner-side offline signing, and explicit acceptance.
# See docs/BUILD_AND_RELEASE.md.
name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # no automatic customer releases from ephemeral CI builds

concurrency:
  # a newer push to the same PR cancels the older run; pushes to main and tags always finish
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the upgrade tests rebuild the first version of the program from the history
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '^22.13.0'  # node:sqlite (gateway/relay D1 stand-in) needs 22.13+
      - name: Browser for the screen tests
        run: |
          python -m pip install playwright xlwt cryptography pillow
          python -m playwright install --with-deps chromium
          echo "TO_CHROMIUM=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()")" >> "$GITHUB_ENV"
      - name: Gateway tests (Worker + D1 stand-in)
        working-directory: gateway
        run: node --test --no-warnings test/gateway.test.js
      - name: Office tests (engine, trips, Excel, Word, gateway client, screens)
        working-directory: tests
        run: python -m unittest test_unit test_convergence test_design test_domain test_trips_api test_xlsx test_excel_io test_word_io test_formats test_gateway_client test_permissions test_pricing test_network test_backup test_time test_import_errors test_multinode test_access_gate test_errors test_guide test_guide_gate test_assist test_e2e_browser test_e2e_driver test_e2e_link_ui test_e2e_guide test_release_files test_crypto test_release_policy test_commercial_licence test_desktop_shell
      - name: Core journey on the source (killed without warning, then restarted)
        run: |
          python -m pip install cryptography
          python tools/journey_exe.py first "$RUNNER_TEMP/journey" python server/app.py
          python tools/journey_exe.py after "$RUNNER_TEMP/journey" python server/app.py

  windows-installer:
    needs: test
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '^22.13.0'  # node:sqlite (gateway/relay D1 stand-in) needs 22.13+
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" ordered-set zstandard cryptography pillow pywebview
          choco upgrade innosetup -y --no-progress
      - name: Generate a throwaway signing key for CI only
        run: python tools/ci_signing_key.py
      - name: Build a NON-CUSTOMER test installer
        run: python tools/build_windows.py
      - name: Check that the built program folder starts and serves its pages
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP 'to-home'
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          '{"port": 18080, "sync_port": 18443, "open_browser": false}' | Set-Content (Join-Path $home_dir 'config.json')
          $env:TO_HOME = $home_dir
          $p = Start-Process -FilePath build\to_main.dist\TripOrders.exe -ArgumentList '--background' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $s = Invoke-RestMethod http://127.0.0.1:18080/api/auth/status
              $page = (Invoke-WebRequest http://127.0.0.1:18080/ -UseBasicParsing).Content
              $js = (Invoke-WebRequest http://127.0.0.1:18080/js/app.js -UseBasicParsing).StatusCode
              $guide = (Invoke-WebRequest http://127.0.0.1:18080/guide/catalogue.json -UseBasicParsing).StatusCode
              if ($s.about.installed -and $page -match 'Trip Orders' -and $js -eq 200 -and $guide -eq 200) { $ok = $true }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content (Join-Path $home_dir 'data\logs\server.log') -ErrorAction SilentlyContinue; throw 'TripOrders.exe did not start correctly' }
          if (-not (Test-Path (Join-Path $home_dir 'data\auth.db'))) { throw 'data was not written to TO_HOME' }
          if (-not (Test-Path (Join-Path $home_dir 'data\assist.db'))) { throw 'the guide and privacy data was not written to TO_HOME' }
          Write-Host 'TripOrders.exe started and served its pages'
      # ---- the INSTALLED product (B6): install, journey, update over it, N-1 update, uninstall ----
      - name: Install silently and check the folder protection and the firewall (office LAN by default, private/domain networks only)
        shell: pwsh
        run: |
          pip install cryptography
          $setup = Get-ChildItem dist/TripOrders-Setup-*.exe | Select-Object -First 1
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          $exe = Join-Path ${env:ProgramFiles} 'TripOrders-CITest\TripOrders.exe'
          if (-not (Test-Path $exe)) { throw 'the installed program is missing' }
          $acl = (icacls (Join-Path ${env:ProgramData} 'TripOrders')) -join "`n"
          Write-Host $acl
          if ($acl -match 'BUILTIN\\Users' -or $acl -match 'Authenticated Users' -or $acl -match 'Everyone') { throw 'the data folder is open to other Windows accounts' }
          $fw = (netsh advfirewall firewall show rule name="Trip Orders CI Test") -join "`n"
          Write-Host $fw
          if ($fw -match 'No rules match') { throw 'the default install must add the firewall rule so the other PCs of the office can connect' }
          if ($fw -notmatch 'Profiles:\s+(Domain,Private|Private,Domain)\s*(\r?\n|$)') { throw 'the firewall rule must be limited to the private and domain profiles' }
          if ($fw -match 'Public' -or $fw -match 'Profiles:\s+Any') { throw 'the firewall rule must never cover public networks' }
          exit 0  # keep the step green whatever netsh returned last
      - name: Core journey on the installed program, then update over it (the trip, the backup and the licence must survive)
        shell: pwsh
        run: |
          $exe = Join-Path ${env:ProgramFiles} 'TripOrders-CITest\TripOrders.exe'
          $h = Join-Path ${env:RUNNER_TEMP} 'journey-office'
          python tools/journey_exe.py first $h $exe
          if ($LASTEXITCODE -ne 0) { throw 'the first journey failed' }
          $setup = Get-ChildItem dist/TripOrders-Setup-*.exe | Select-Object -First 1
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          python tools/journey_exe.py after $h $exe
          if ($LASTEXITCODE -ne 0) { throw 'the office did not survive the update' }
      - name: Update from the previous release (N-1) keeps the data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path ${env:RUNNER_TEMP} 'previous'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'TripOrders-Setup-*.exe' --dir $dir 2>$null
          $old = Get-ChildItem $dir -Filter 'TripOrders-Setup-*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $old) { Write-Host 'NOTICE: no earlier release exists yet, so the N-1 update could not be exercised here'; exit 0 }
          $unins = Join-Path ${env:ProgramFiles} 'TripOrders-CITest\unins000.exe'
          (Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          Remove-Item -Recurse -Force (Join-Path ${env:ProgramData} 'TripOrders') -ErrorAction SilentlyContinue
          (Start-Process -FilePath $old.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          # the previous release is a customer build in Program Files\TripOrders; this CI-test build has its own
          # AppId and folder (it can never replace a customer install), so it reads the same office data side by side
          $oldExe = Join-Path ${env:ProgramFiles} 'TripOrders\TripOrders.exe'
          $h = Join-Path ${env:RUNNER_TEMP} 'journey-n1'
          python tools/journey_exe.py legacy $h $oldExe
          if ($LASTEXITCODE -ne 0) { throw 'the previous release did not run the journey' }
          $setup = Get-ChildItem dist/TripOrders-Setup-*.exe | Select-Object -First 1
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          if (-not (Test-Path $oldExe)) { throw 'the CI-test installer must not touch the customer install' }
          $exe = Join-Path ${env:ProgramFiles} 'TripOrders-CITest\TripOrders.exe'
          python tools/journey_exe.py after $h $exe
          if ($LASTEXITCODE -ne 0) { throw 'the CI-test build could not read the office data of the previous release' }
          $oldUnins = Join-Path ${env:ProgramFiles} 'TripOrders\unins000.exe'
          (Start-Process -FilePath $oldUnins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          if ($LASTEXITCODE -ne 0) { throw 'the update from the previous release lost data' }
      - name: Release proof (source commit, version, installer checksum, this run)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/TripOrders-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $version = python -c "import sys; sys.path.insert(0, 'server'); import version; print(version.VERSION)"
          $proof = @("product: Trip Orders", "version: $version", "source_commit: ${env:GITHUB_SHA}", "ref: ${env:GITHUB_REF}",
            "installer: $($setup.Name)", "installer_sha256: $hash",
            "workflow_run: ${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}/actions/runs/${env:GITHUB_RUN_ID}",
            "checks: built folder smoke, silent install, data-folder ACL, firewall rule private/domain only, installed core journey, update keeps data, N-1 update, uninstall keeps data, this-PC-only install has no firewall rule")
          $proof | Set-Content -Encoding utf8 dist/RELEASE-PROOF.txt
          Get-Content dist/RELEASE-PROOF.txt
      - name: Uninstall keeps the office's data
        shell: pwsh
        run: |
          $unins = Join-Path ${env:ProgramFiles} 'TripOrders-CITest\unins000.exe'
          (Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          if (Test-Path (Join-Path ${env:ProgramFiles} 'TripOrders-CITest\TripOrders.exe')) { throw 'the program was not removed' }
          if (-not (Test-Path (Join-Path ${env:ProgramData} 'TripOrders'))) { throw 'the data folder must survive an uninstall' }
          $fw = (netsh advfirewall firewall show rule name="Trip Orders CI Test") -join "`n"
          if ($fw -notmatch 'No rules match') { throw 'the uninstall must remove the firewall rule' }
          exit 0  # netsh returns 1 when the rule is missing, which is the expected result here
      - name: Install with "This PC only" adds no firewall rule and writes the this-PC-only setting
        shell: pwsh
        run: |
          $cfg = Join-Path ${env:ProgramData} 'TripOrders\config.json'
          Remove-Item $cfg -Force -ErrorAction SilentlyContinue  # the installer writes the setting only when the office has none yet
          $setup = Get-ChildItem dist/TripOrders-Setup-*.exe | Select-Object -First 1
          (Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=thispconly' -PassThru).WaitForExit()
          if (-not (Test-Path (Join-Path ${env:ProgramFiles} 'TripOrders-CITest\TripOrders.exe'))) { throw 'the installed program is missing' }
          $fw = (netsh advfirewall firewall show rule name="Trip Orders CI Test") -join "`n"
          if ($fw -notmatch 'No rules match') { throw 'a firewall rule exists although the office chose this PC only' }
          if ((Get-Content $cfg -Raw | ConvertFrom-Json).host -ne '127.0.0.1') { throw 'this-PC-only must write host 127.0.0.1' }
          $unins = Join-Path ${env:ProgramFiles} 'TripOrders-CITest\unins000.exe'
          (Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          exit 0  # netsh returns 1 when the rule is missing, which is the expected result here
      - uses: actions/upload-artifact@v7
        with:
          name: TripOrders-CI-TEST-NOT-FOR-CUSTOMERS
          path: |
            dist/TripOrders-Setup-*.exe
            dist/RELEASE-PROOF.txt
            dist/CI-TEST-BUILD-NOT-FOR-CUSTOMERS.txt
          retention-days: 30
      # Deliberately NO 'gh release create': CI keys are ephemeral and must
      # never create a real customer installer. Build the customer release
      # under the owner's controlled commercial signing process instead.
