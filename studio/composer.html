<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Film composer</title>
<style>
@font-face { font-family: 'Plex Arabic'; src: url('../fonts/plex-arabic-arabic-400.woff2') format('woff2'); font-weight: 400; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'Plex Arabic'; src: url('../fonts/plex-arabic-arabic-600.woff2') format('woff2'); font-weight: 600; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'Plex Arabic'; src: url('../fonts/plex-arabic-arabic-700.woff2') format('woff2'); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: 'Plex Arabic'; src: url('../fonts/plex-arabic-latin-400.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Plex Arabic'; src: url('../fonts/plex-arabic-latin-600.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Plex Arabic'; src: url('../fonts/plex-arabic-latin-700.woff2') format('woff2'); font-weight: 700; }
:root { --navy: #13294b; --navy-2: #0b1a33; --amber: #f2a900; --ink: #f3f6fb; --ink-2: #a9b6cc; --ok: #3ccf8e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy-2); }
body { font-family: 'Plex Arabic', sans-serif; color: var(--ink); }
#stage { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(1200px 700px at 78% 18%, rgba(242,169,0,.13), transparent 60%), radial-gradient(1400px 900px at 20% 90%, rgba(70,120,210,.18), transparent 60%), linear-gradient(160deg, #10234a, #091629 70%); }
.grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 4px 4px; }
/* the program window */
.win { position: absolute; left: 60px; top: 150px; width: 1340px; border-radius: 18px; overflow: hidden; background: #fff;
  box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); transform-origin: 50% 50%; will-change: transform, opacity; }
.win .bar { height: 38px; background: #e9edf3; display: flex; align-items: center; gap: 10px; padding: 0 16px; direction: ltr; }
.win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #c9cfd8; display: block; }
.win .bar span { flex: 1; text-align: center; font-size: 15px; color: #56657e; direction: rtl; }
.win .view { position: relative; width: 1340px; height: 837.5px; overflow: hidden; background: #e8edf4; }
.win .view img { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
/* the phone */
.phone { position: absolute; top: 120px; left: 520px; width: 430px; height: 905px; border-radius: 58px; background: #05070b; padding: 15px;
  box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 2px #2a3140, inset 0 0 0 2px #11151d; will-change: transform, opacity; }
.phone .screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #f4f6fb; }
.phone .screen img { position: absolute; inset: 0; width: 100%; height: 100%; }
.phone .notch { position: absolute; top: 14px; left: 50%; width: 110px; height: 28px; margin-left: -55px; border-radius: 20px; background: #05070b; z-index: 3; }
.side { position: absolute; top: 330px; width: 380px; font-size: 30px; line-height: 1.55; color: var(--ink); will-change: transform, opacity; }
.side b { color: var(--amber); display: block; font-size: 20px; letter-spacing: .02em; margin-bottom: 8px; }
/* titles */
.title { position: absolute; top: 34px; right: 60px; display: flex; align-items: baseline; gap: 18px; will-change: transform, opacity; }
.title .k { font-size: 22px; font-weight: 700; color: var(--navy); background: var(--amber); border-radius: 999px; padding: 4px 16px 6px; }
.title .t { font-size: 46px; font-weight: 700; letter-spacing: -.01em; }
.cap { position: absolute; top: 46px; left: 60px; max-width: 760px; font-size: 25px; font-weight: 600; color: var(--ink); background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 10px 20px 12px; will-change: transform, opacity; }
.cap small { color: var(--ink-2); font-weight: 400; }
/* the persistent actor card */
.actor { position: absolute; right: 60px; top: 150px; width: 400px; border-radius: 22px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  padding: 22px 24px; will-change: transform, opacity; }
.actor h4 { font-size: 18px; color: var(--ink-2); font-weight: 400; }
.actor .no { font-size: 36px; font-weight: 700; direction: ltr; text-align: right; letter-spacing: .02em; margin: 2px 0 6px; }
.actor .meta { font-size: 19px; color: var(--ink-2); line-height: 1.6; }
.actor ul { list-style: none; margin-top: 14px; display: grid; gap: 9px; }
.actor li { display: flex; align-items: center; gap: 12px; font-size: 21px; color: rgba(243,246,251,.42); }
.actor li i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center; font-style: normal; font-size: 16px; flex: none; }
.actor li.on { color: var(--ink); }
.actor li.on i { background: var(--ok); border-color: var(--ok); color: #062b1a; font-weight: 700; }
.actor li em { font-style: normal; margin-inline-start: auto; color: var(--amber); font-weight: 700; direction: ltr; }
/* stamps: below the card, never over the program */
.stamp { position: absolute; right: 60px; width: 400px; border-radius: 22px; background: var(--amber); color: var(--navy); padding: 18px 24px 20px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
  will-change: transform, opacity; }
.stamp .v { font-size: 50px; font-weight: 700; line-height: 1.05; direction: ltr; text-align: right; }
.stamp .l { font-size: 20px; font-weight: 600; margin-top: 4px; }
/* opening and end */
.open { position: absolute; right: 60px; top: 150px; width: 430px; will-change: transform, opacity; }
.open .big { font-size: 64px; font-weight: 700; line-height: 1.15; }
.open .big span { color: var(--amber); }
.open .sub { margin-top: 22px; font-size: 22px; color: var(--ink-2); line-height: 1.6; }
.end { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; will-change: opacity; }
.end .a { font-size: 76px; font-weight: 700; }
.end .a span { color: var(--amber); }
.end .b { margin-top: 26px; font-size: 26px; color: var(--ink-2); }
.end .c { margin-top: 40px; display: inline-flex; gap: 14px; align-items: center; font-size: 24px; color: var(--ink); }
.end .c i { width: 46px; height: 46px; border-radius: 12px; background: var(--amber); display: inline-grid; place-items: center; color: var(--navy); font-style: normal; font-weight: 700; font-size: 24px; }
.black { position: absolute; inset: 0; background: #000; pointer-events: none; }
.hide { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="grain"></div>
  <div class="win" id="win"><div class="bar"><i></i><i></i><i></i><span id="winbar">أوامر التشغيل · كمبيوتر المكتب</span></div><div class="view"><img id="ofr" alt=""></div></div>
  <div class="phone" id="phone"><div class="screen"><div class="notch"></div><img id="pfr" alt=""></div></div>
  <div class="side" id="side"></div>
  <div class="title" id="title"><span class="k" id="tk"></span><span class="t" id="tt"></span></div>
  <div class="cap" id="cap"></div>
  <div class="open" id="open"><div class="big">أمر تشغيل واحد<br><span>من الطلب للتقرير</span></div><div class="sub">الشاشات الحقيقية للبرنامج، شغّالة قدامك<br>شركة وبيانات تجريبية · ساعة استوديو</div></div>
  <div class="actor" id="actor"><h4>المشوار اللي بنتابعه</h4><div class="no" id="ano"></div><div class="meta" id="ameta"></div><ul id="chips"></ul></div>
  <div class="stamp" id="stamp"><div class="v" id="sv"></div><div class="l" id="sl"></div></div>
  <div class="end" id="end"><div><div class="a" id="ea"></div><div class="b" id="eb"></div><div class="c"><i>✓</i><span id="ec"></span></div></div></div>
  <div class="black" id="black"></div>
</div>
<script src="cuts/film1.cut.js"></script>
<script src="composer.js"></script>
</body>
</html>
