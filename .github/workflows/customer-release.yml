# Builds the CUSTOMER installer on a GitHub Windows runner with the owner's real PUBLIC verification keys.
# Public keys are not secrets; no private key is used or needed. Manual only. It never publishes:
# the release is created separately after the owner approved it and this run's checks passed.
name: Customer release build

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'VERSION in server/version.py must equal this (e.g. 1.1.3)'
        required: true
      previous_tag:
        description: 'Published release to upgrade from (N-1)'
        required: true
        default: 'v1.1.2'

permissions:
  contents: read

env:
  # owner PUBLIC keys: trial-hub (licence hub trial + calendar) and paid (hub monthly/permanent)
  TO_RELEASE_PUBLIC_KEYS: 'trial-hub:I4syALksvwqkGv5XUANtX32LandWOABv4-RveQU-vhM,paid:INmxPP1zYT4XyHDJQaS3_R_6nt4HCIlG-6-3kAIgfJI'
  TO_COMMERCIAL_PUBLIC_KEYS: 'trial-hub:I4syALksvwqkGv5XUANtX32LandWOABv4-RveQU-vhM,paid:INmxPP1zYT4XyHDJQaS3_R_6nt4HCIlG-6-3kAIgfJI'
  TO_BUILD_CHANNEL: commercial
  LICENCE_HUB_URL: 'https://trip-orders-licence-hub.mflma2040.workers.dev'
  VERSION_IN: ${{ inputs.expected_version }}
  PREVIOUS_TAG: ${{ inputs.previous_tag }}

jobs:
  customer-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Only from main
        shell: bash
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "run this on main, not $GITHUB_REF"; exit 1; }'
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '^22.13.0'
      - name: Version matches
        shell: bash
        run: |
          [[ "$VERSION_IN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'bad version input'; exit 1; }
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'bad previous tag'; exit 1; }
          v=$(python -c "import sys; sys.path.insert(0,'server'); import version; print(version.VERSION)")
          [ "$v" = "$VERSION_IN" ] || { echo "VERSION is $v, expected $VERSION_IN"; exit 1; }
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" ordered-set zstandard cryptography
          choco upgrade innosetup -y --no-progress
      - name: Build the CUSTOMER installer (commercial channel, real public keys)
        run: python tools/build_windows.py
      - name: It is the customer installer, not the CI test one
        shell: pwsh
        run: |
          $setup = "dist/TripOrders-Setup-$($env:VERSION_IN).exe"
          if (-not (Test-Path $setup)) { Get-ChildItem dist; throw "missing $setup" }
          if (Test-Path dist/CI-TEST-BUILD-NOT-FOR-CUSTOMERS.txt) { throw 'CI-TEST marker present' }
      - name: Install the previous release (N-1) and make data on it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install cryptography
          python tools/prepare_n1_for_legacy.py | ForEach-Object {
            if ($_ -match '^N1_SETUP_EXE=(.+)$') { $env:N1_SETUP_EXE = $Matches[1].Trim() }
          }
          if ($LASTEXITCODE -ne 0) { throw 'could not prepare the N-1 installer' }
          if (-not $env:N1_SETUP_EXE) { throw 'prepare_n1_for_legacy did not set N1_SETUP_EXE' }
          Write-Host "N-1 installer: $env:N1_SETUP_EXE"
          $old = Get-Item -LiteralPath $env:N1_SETUP_EXE
          (Start-Process -FilePath $old.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          $exe = Join-Path ${env:ProgramFiles} 'TripOrders\TripOrders.exe'
          if (-not (Test-Path $exe)) { throw 'the previous release did not install' }
          python tools/journey_exe.py legacy (Join-Path $env:RUNNER_TEMP 'office') $exe
          if ($LASTEXITCODE -ne 0) { throw 'the previous release journey failed' }
      - name: Silent upgrade to the new installer, then start it and check licence + data
        shell: pwsh
        run: |
          $setup = "dist/TripOrders-Setup-$($env:VERSION_IN).exe"
          (Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          $exe = Join-Path ${env:ProgramFiles} 'TripOrders\TripOrders.exe'
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "installed version: $ver"
          if (-not $ver.StartsWith($env:VERSION_IN)) { throw "installed version is $ver" }
          if (Test-Path (Join-Path ${env:ProgramFiles} 'TripOrders-CITest')) { throw 'CI-test folder present' }
          $env:TRIPORDERS_DPAPI_DIR = Join-Path $env:RUNNER_TEMP 'dpapi'
          New-Item -ItemType Directory -Force $env:TRIPORDERS_DPAPI_DIR | Out-Null
          python tools/customer_release_check.py upgraded (Join-Path $env:RUNNER_TEMP 'office') $exe $env:LICENCE_HUB_URL
          if ($LASTEXITCODE -ne 0) { throw 'customer release check failed' }
      - name: Fresh office on the installed program is an enforced commercial build without a licence
        shell: pwsh
        run: |
          $exe = Join-Path ${env:ProgramFiles} 'TripOrders\TripOrders.exe'
          $env:TRIPORDERS_DPAPI_DIR = Join-Path $env:RUNNER_TEMP 'dpapi-fresh'
          New-Item -ItemType Directory -Force $env:TRIPORDERS_DPAPI_DIR | Out-Null
          python tools/customer_release_check.py fresh (Join-Path $env:RUNNER_TEMP 'fresh') $exe
          if ($LASTEXITCODE -ne 0) { throw 'fresh install check failed' }
      - name: Proof
        shell: pwsh
        run: |
          $setup = Get-Item "dist/TripOrders-Setup-$($env:VERSION_IN).exe"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          @("product: Trip Orders", "version: $($env:VERSION_IN)", "channel: commercial", "source_commit: ${env:GITHUB_SHA}",
            "installer: $($setup.Name)", "size: $($setup.Length)", "installer_sha256: $hash",
            "public_keys: ${env:TO_RELEASE_PUBLIC_KEYS}",
            "workflow_run: ${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}/actions/runs/${env:GITHUB_RUN_ID}",
            "checks: silent install of $($env:PREVIOUS_TAG) + legacy journey, silent upgrade, commercial+enforced, admin+backup kept, forged code refused, live hub signed calendar accepted by pinned trial-hub key, fresh install starts enforced") |
            Set-Content -Encoding utf8 dist/RELEASE-PROOF.txt
          Get-Content dist/RELEASE-PROOF.txt
      - uses: actions/upload-artifact@v7
        with:
          name: TripOrders-CUSTOMER-${{ env.VERSION_IN }}
          path: |
            dist/TripOrders-Setup-*.exe
            dist/RELEASE-PROOF.txt
          retention-days: 90
